<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>UMCIHCS form definitions</title></head>
  <body>
    <form name="contact-enquiry" data-netlify="true" data-netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="contact-enquiry">
      <input type="hidden" name="subject" data-remove-prefix value="UMCIHCS contact enquiry">
      <input name="kind"><input name="name"><input name="email"><input name="phone">
      <input name="location"><input name="organisation"><input name="profile"><input name="interest">
      <textarea name="message"></textarea><input name="consent"><input name="website">
    </form>
    <form name="membership-application" data-netlify="true" data-netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="membership-application">
      <input type="hidden" name="subject" data-remove-prefix value="UMCIHCS membership application">
      <input name="application_reference"><input name="submission_date"><input name="application_status">
      <input name="applicant_type"><input name="full_name"><input name="date_of_birth"><input name="gender">
      <input name="nationality"><input name="occupation"><input name="phone_primary"><input name="phone_alternative">
      <input name="email"><input name="country_residence"><input name="district_city"><input name="physical_address">
      <input name="organization_name"><input name="trading_name"><input name="organization_type"><input name="registration_number">
      <input name="country_registration"><input name="registration_year"><input name="tin"><textarea name="business_activities"></textarea>
      <input name="registered_office_address"><input name="operations_location"><input name="website_url">
      <input name="registration_certificate" type="file"><input name="representative_name"><input name="representative_position">
      <input name="representative_phone"><input name="representative_email"><input name="representative_alt_phone">
      <input name="authorization_declaration"><input name="areas_of_interest"><input name="area_interest_other">
      <input name="sector_involvement"><textarea name="sector_experience"></textarea><input name="heard_about">
      <input name="heard_about_other"><textarea name="join_reason"></textarea><textarea name="membership_benefits"></textarea>
      <textarea name="cooperative_contribution"></textarea><input name="declaration_accurate"><input name="declaration_bylaws">
      <input name="declaration_review"><input name="declaration_privacy"><input name="newsletter_consent"><input name="website">
    </form>
  </body>
</html>
