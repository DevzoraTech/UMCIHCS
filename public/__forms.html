<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>UMCIHCS form definitions</title></head>
  <body>
    <form name="contact-enquiry" data-netlify="true" data-netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="contact-enquiry">
      <input type="hidden" name="subject" data-remove-prefix value="UMCIHCS contact enquiry">
      <input name="kind"><input name="name"><input name="email"><input name="phone">
      <input name="location"><input name="organisation"><input name="profile"><input name="interest">
      <textarea name="message"></textarea><input name="consent"><input name="website">
    </form>
    <form name="membership-application" data-netlify="true" data-netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="membership-application">
      <input type="hidden" name="subject" data-remove-prefix value="UMCIHCS membership application">
      <input name="kind"><input name="name"><input name="email"><input name="phone">
      <input name="location"><input name="organisation"><input name="profile"><input name="interest">
      <textarea name="message"></textarea><input name="consent"><input name="website">
    </form>
  </body>
</html>
